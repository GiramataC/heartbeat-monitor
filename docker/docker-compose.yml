version: "3.9"

# =============================================================================
# docker-compose.yml
# Real-Time Customer Heart Beat Monitoring System
#
# Services:
#   zookeeper  – Kafka coordination (required by Kafka < 4.x)
#   kafka      – Message broker
#   kafka-ui   – Browser UI for inspecting topics (optional, very handy)
#   postgres   – Time-series storage
#   pgadmin    – Browser UI for PostgreSQL (optional)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Zookeeper – Kafka's coordination service
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: heartbeat_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kafka broker
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: heartbeat_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"       # external (host) access
      - "29092:29092"     # internal (container-to-container) access
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Retain messages for 7 days (useful for replay / debugging)
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824   # 1 GB cap per partition
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Kafka UI – explore topics, messages, consumer groups visually
  # Access at http://localhost:8080
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: heartbeat_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # - "8080:8080"
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # ---------------------------------------------------------------------------
  # PostgreSQL – persistent storage
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: heartbeat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: heartbeat_db
      POSTGRES_USER: heartbeat_user
      POSTGRES_PASSWORD: heartbeat_pass
    ports:
      # - "5432:5432"
      # - "5433:5432"
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run schema on first startup
      # - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartbeat_user -d heartbeat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # pgAdmin – web UI for PostgreSQL
  # Access at http://localhost:5050
  # Login: admin@heartbeat.local / admin
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: heartbeat_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # - "5050:80"
      - "5051:80"
      
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@heartbeat.local
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin

# =============================================================================
# Named volumes – data persists between container restarts
# =============================================================================
volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  postgres_data:
  pgadmin_data:
