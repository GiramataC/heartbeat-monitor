<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>Real-Time Heart Beat Monitoring System – Data Flow Diagram</title>
  <desc>Data flows from a synthetic generator through Kafka into PostgreSQL with an optional Streamlit dashboard.</desc>

  <!-- Background -->
  <rect width="900" height="620" fill="#FAFAF9" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#2C2C2A">Real-Time Customer Heart Beat Monitoring System</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#888780">Data Flow Architecture</text>

  <!-- ─── Simulation Layer (dashed box) ─── -->
  <rect x="30" y="76" width="200" height="190" rx="10" fill="none" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="130" y="96" text-anchor="middle" font-size="11" fill="#888780">Simulation layer</text>

  <!-- Data Generator -->
  <rect x="50" y="104" width="160" height="66" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="130" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Data generator</text>
  <text x="130" y="150" text-anchor="middle" font-size="11" fill="#0F6E56">data_generator.py</text>
  <text x="130" y="165" text-anchor="middle" font-size="10" fill="#0F6E56">5 customers · ~1 reading/sec</text>

  <!-- Arrow → Producer -->
  <line x1="210" y1="137" x2="262" y2="137" stroke="#7F77DD" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="236" y="130" text-anchor="middle" font-size="10" fill="#534AB7">JSON</text>

  <!-- Kafka Producer -->
  <rect x="262" y="104" width="160" height="66" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="342" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Kafka producer</text>
  <text x="342" y="150" text-anchor="middle" font-size="11" fill="#534AB7">kafka_producer.py</text>
  <text x="342" y="165" text-anchor="middle" font-size="10" fill="#534AB7">acks=all · gzip · retry×5</text>

  <!-- Arrow → Kafka -->
  <line x1="422" y1="137" x2="474" y2="137" stroke="#BA7517" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <text x="448" y="130" text-anchor="middle" font-size="10" fill="#854F0B">publish</text>

  <!-- ─── Kafka Broker (dashed box) ─── -->
  <rect x="474" y="76" width="250" height="190" rx="10" fill="none" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="599" y="94" text-anchor="middle" font-size="11" fill="#888780">docker-compose.yml</text>

  <!-- Kafka Broker -->
  <rect x="492" y="100" width="214" height="76" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="599" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#412402">Kafka broker</text>
  <text x="599" y="146" text-anchor="middle" font-size="11" fill="#633806">Topic: heartbeat</text>
  <text x="599" y="162" text-anchor="middle" font-size="10" fill="#633806">Confluent Kafka 7.6 · Zookeeper · 7-day retention</text>

  <!-- Kafka UI -->
  <rect x="492" y="192" width="214" height="52" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
  <text x="599" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#173404">Kafka UI</text>
  <text x="599" y="232" text-anchor="middle" font-size="10" fill="#3B6D11">localhost:8080 · topic browser</text>

  <!-- Arrow ↓ Consumer -->
  <line x1="599" y1="266" x2="599" y2="318" stroke="#993C1D" stroke-width="1.8" marker-end="url(#arrowCoral)"/>
  <text x="618" y="296" font-size="10" fill="#993C1D">consume</text>

  <!-- ─── Kafka Consumer ─── -->
  <rect x="310" y="318" width="578" height="90" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="599" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">Kafka consumer</text>
  <text x="599" y="368" text-anchor="middle" font-size="11" fill="#993C1D">kafka_consumer.py · JSON schema validation · heart rate classification</text>
  <text x="599" y="386" text-anchor="middle" font-size="11" fill="#993C1D">NORMAL (50–130 bpm)  ·  WARNING (40–49 / 131–150)  ·  CRITICAL (&lt;40 / &gt;150)</text>

  <!-- Arrow ↓ Postgres -->
  <line x1="540" y1="408" x2="440" y2="450" stroke="#185FA5" stroke-width="1.8" marker-end="url(#arrowBlue2)"/>
  <text x="464" y="432" text-anchor="middle" font-size="10" fill="#185FA5">INSERT rows</text>

  <!-- ─── PostgreSQL ─── -->
  <rect x="200" y="450" width="320" height="90" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="360" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53">PostgreSQL 16</text>
  <text x="360" y="498" text-anchor="middle" font-size="11" fill="#185FA5">heartbeat_db · heart_rate_readings · customers</text>
  <text x="360" y="516" text-anchor="middle" font-size="10" fill="#185FA5">Indexed on (reading_timestamp) + (customer_id, reading_timestamp)</text>

  <!-- Arrow → Streamlit -->
  <line x1="520" y1="495" x2="580" y2="495" stroke="#3B6D11" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="550" y="487" text-anchor="middle" font-size="10" fill="#3B6D11">query</text>

  <!-- ─── Streamlit Dashboard ─── -->
  <rect x="580" y="455" width="210" height="80" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
  <text x="685" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="#173404">Streamlit dashboard</text>
  <text x="685" y="502" text-anchor="middle" font-size="11" fill="#3B6D11">dashboard.py · optional</text>
  <text x="685" y="518" text-anchor="middle" font-size="10" fill="#3B6D11">localhost:8501 · Plotly charts</text>

  <!-- ─── pgAdmin ─── -->
  <rect x="30" y="450" width="160" height="80" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="110" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">pgAdmin 4</text>
  <text x="110" y="498" text-anchor="middle" font-size="11" fill="#5F5E5A">localhost:5050</text>
  <text x="110" y="514" text-anchor="middle" font-size="10" fill="#5F5E5A">DB browser / query UI</text>

  <!-- Arrow Postgres → pgAdmin -->
  <line x1="200" y1="490" x2="192" y2="490" stroke="#888780" stroke-width="1.2" marker-end="url(#arrowGray)"/>

  <!-- ─── Legend ─── -->
  <rect x="30" y="564" width="840" height="42" rx="6" fill="#F1EFE8"/>
  <circle cx="56" cy="585" r="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="68" y="589" font-size="11" fill="#5F5E5A">Simulation</text>
  <circle cx="148" cy="585" r="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="160" y="589" font-size="11" fill="#5F5E5A">Streaming</text>
  <circle cx="238" cy="585" r="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="250" y="589" font-size="11" fill="#5F5E5A">Kafka broker</text>
  <circle cx="346" cy="585" r="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="358" y="589" font-size="11" fill="#5F5E5A">Processing</text>
  <circle cx="444" cy="585" r="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="456" y="589" font-size="11" fill="#5F5E5A">Storage</text>
  <circle cx="526" cy="585" r="6" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
  <text x="538" y="589" font-size="11" fill="#5F5E5A">Dashboard</text>
  <circle cx="624" cy="585" r="6" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="636" y="589" font-size="11" fill="#5F5E5A">Admin UI</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
